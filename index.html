<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NHK News Reader</title>
    <meta name="description" content="An application that fetches the latest NHK news from an RSS feed, translates it from Japanese to English, and reads both versions aloud using Gemini API." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'nhk-red': '#d60010',
              'nhk-gray': '#333333',
            },
            fontFamily: {
              sans: ['"Helvetica Neue"', 'Arial', '"Hiragino Kaku Gothic ProN"', '"Hiragino Sans"', 'Meiryo', 'sans-serif'],
            }
          }
        }
      }
    </script>
</head>
  <body class="bg-gray-100 dark:bg-nhk-gray text-gray-900 dark:text-gray-100">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
